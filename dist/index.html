<!doctype html>
<html lang="zh-CN" data-auth="required">
<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="用色彩记录熟悉度的英语生词本">
  <title>词块 · 英语生词本</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <section class="auth-gate" aria-labelledby="auth-title">
    <div class="auth-panel">
      <span class="logo" aria-hidden="true">▦</span>
      <h1 id="auth-title">登录词块</h1>
      <p id="auth-status" class="muted" role="status">正在检查登录状态…</p>
      <div id="clerk-sign-in"></div>
    </div>
  </section>
  <aside class="sidebar">
    <a class="brand" href="#words"><span class="logo" aria-hidden="true">▦</span><span>词块<small>WORD BLOCKS</small></span></a>
    <nav aria-label="主导航">
      <a href="#words" data-page="words"><span aria-hidden="true">▦</span> 单词本</a>
      <a href="#stats" data-page="stats"><span aria-hidden="true">▥</span> 学习统计</a>
      <a href="#library" data-page="library"><span aria-hidden="true">▤</span> PDF 例句库</a>
    </nav>
    <div class="sidebar-foot"><i></i> <span id="storage-label">保存在此浏览器</span></div>
  </aside>
  <main>
    <header class="top"><span id="breadcrumb">我的词库 / 单词本</span><div class="top-actions"><button class="primary" id="add"><span aria-hidden="true">＋</span> 添加单词</button><div id="clerk-account"></div></div></header>
    <div id="view"></div>
  </main>
  <dialog id="editor">
    <form id="entry">
      <div class="dialog-head"><h2 id="editor-title">添加单词</h2><button type="button" class="icon" id="close" aria-label="关闭">×</button></div>
      <label>英文单词 <span class="required">*</span><input name="word" required maxlength="60" placeholder="例如 adventure" autocomplete="off" spellcheck="false"></label>
      <p class="muted form-note" id="auto-note">保存时自动补充音标、中文释义和例句，并匹配 PDF 例句库。</p>
      <p id="form-status" role="status"></p>
      <details id="manual-fields" hidden><summary>编辑已保存的内容</summary>
        <label>中文释义<input name="meaning"></label>
        <div class="paired"><label>美式音标<input name="us"></label><label>国际音标（IPA）<input name="ipa"></label></div>
        <label>补充英文例句<textarea name="example" rows="2"></textarea></label>
        <label>例句译文<input name="translation"></label>
      </details>
      <div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" id="save-entry" type="submit">保存单词</button></div>
    </form>
  </dialog>
  <input type="file" id="pdf-files" accept=".pdf,application/pdf" multiple hidden>
  <div id="toast" role="status"></div>
</body>
</html>
